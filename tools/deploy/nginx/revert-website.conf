# Revert (ré-vert) company website (static): https://revert.co.in. www and plain http redirect there.
# Files: /var/www/revert.co.in. Certificate "revert.co.in" covers revert.co.in, www.revert.co.in, erp.revert.co.in.
# The ERP is erp.revert.co.in (erp-revert.conf). Enquiry form posts to /api/lead, proxied to Odoo (rvt_website_lead).
limit_req_zone $binary_remote_addr zone=revert_lead:10m rate=6r/m;
server {
    listen 80;
    listen [::]:80;
    server_name revert.co.in www.revert.co.in;
    include snippets/acme-challenge.conf;
    location / { return 301 https://revert.co.in$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.revert.co.in;
    ssl_certificate /etc/letsencrypt/live/revert.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revert.co.in/privkey.pem;
    include snippets/erp-tls.conf;
    return 301 https://revert.co.in$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name revert.co.in;
    ssl_certificate /etc/letsencrypt/live/revert.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revert.co.in/privkey.pem;
    include snippets/erp-tls.conf;
    access_log /var/log/nginx/revert.co.in.access.log;
    error_log /var/log/nginx/revert.co.in.error.log;

    root /var/www/revert.co.in;
    index index.html;

    # server-level headers; a location with its own add_header would drop these, so locations use expires only
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # the page: browsers re-check it on every visit, so a new upload shows at once
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
    # enquiry form -> Odoo CRM lead (module rvt_website_lead). Same origin, so no CORS; rate-limited per IP.
    location = /api/lead {
        limit_except POST { deny all; }
        limit_req zone=revert_lead burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_set_header Host erp.revert.co.in;
        proxy_set_header X-Forwarded-Host erp.revert.co.in;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://erp_http/rvt/lead;
    }
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
