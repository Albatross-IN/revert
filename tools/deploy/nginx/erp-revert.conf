# Revert on the shared Odoo 20 ERP: erp.revert.co.in serves database "erp.revert.co.in" (dbfilter ^%h$).
# Moved from revert.albatross.work on 2026-11-16; that host now only redirects here. Released (no pre-release lock).
# The website revert.co.in is a separate static site: revert-website.conf.
server {
    listen 80;
    listen [::]:80;
    server_name erp.revert.co.in revert.albatross.work;
    include snippets/acme-challenge.conf;
    location / { return 301 https://erp.revert.co.in$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name revert.albatross.work;
    ssl_certificate /etc/letsencrypt/live/revert.albatross.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revert.albatross.work/privkey.pem;
    include snippets/erp-tls.conf;
    return 301 https://erp.revert.co.in$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name erp.revert.co.in;
    ssl_certificate /etc/letsencrypt/live/revert.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revert.co.in/privkey.pem;
    include snippets/erp-tls.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/erp.revert.co.in.access.log;
    error_log /var/log/nginx/erp.revert.co.in.error.log;
    # released 2026-11-16: no pre-release lock (snippets/erp-revert-prerelease.conf kept for reference)
    # the website lead endpoint is only reachable through https://revert.co.in/api/lead (rate-limited there)
    location = /rvt/lead { return 404; }
    include snippets/erp-odoo.conf;
}
